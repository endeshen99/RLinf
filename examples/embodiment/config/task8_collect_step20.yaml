# Task 8 (LIBERO-10 moka) rollout-only pass from step20: one iteration of 64 episodes dumped as LeRobot shards, the
# self-generated replay data mixed into condition D (SFT on task-64 demos). Same env/sampling as task2b_collect_step20.yaml.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "/results/task8_collect"
    project_name: rlinf
    experiment_name: "task8_collect_step20"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: 1              # one iteration = 64 episodes
  only_eval: False
  val_check_interval: -1
  save_interval: -1         # disabled: no parameters change in this pass (a positive value still saves at the last step)
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 0           # rollout only: no optimizer step; weights stay at step20
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    task_id_filter: [8]           # LIBERO-10 task 8: put both moka pots on the stove
    rollout_epoch: 4          # 4 rounds x 16 envs = 64 rollouts = 8 groups of G=8 per update
    total_num_envs: 16
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    seed: 7
    data_collection:          # keep A's rollouts: every finished train episode -> LeRobot shard (opt-in wrapper, off the training data path)
      enabled: True
      save_dir: /rollouts/task2b/moka_collect
      export_format: lerobot
      only_success: False
      robot_type: panda
      fps: 10
      finalize_interval: 1    # finalize a shard per episode so nothing depends on process-exit hooks
  eval:
    task_id_filter: [8]           # LIBERO-10 task 8: put both moka pots on the stove
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/ckpts/exports/step20"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64     # = rollouts per update (rollout_epoch * total_num_envs)
  seed: 42
  enable_offload: True
  model:
    model_path: "/ckpts/exports/step20"
    num_action_chunks: 5      # env-executed chunk: replan every 5 steps (openpi protocol); network horizon stays 10
    num_steps: 10             # flow steps: match the openpi protocol exactly (chunk 5 / 10 steps, base 16/25)
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False
critic:
  use_critic_model: False
